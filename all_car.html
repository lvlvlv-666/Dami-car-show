<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小米汽车</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f5f5f5;
        color: #1a1a1a;
        padding: 30px 16px;
    }
    .box { max-width: 700px; margin: 0 auto; }
    h1 { text-align: center; font-size: 26px; margin-bottom: 20px; }
    .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 24px; }
    .tabs button {
        padding: 8px 26px;
        border: none;
        border-radius: 20px;
        background: #e0e0e0;
        color: #555;
        font-size: 15px;
        cursor: pointer;
    }
    .tabs button.on { background: #ff6900; color: #fff; }
    .card { display: none; background: #fff; border-radius: 12px; padding: 24px; }
    .card.on { display: block; }
    .card img {
        width: 100%;
        height: 260px;
        object-fit: cover;
        border-radius: 10px;
        margin-bottom: 18px;
        display: block;
    }
    .card h2 { font-size: 22px; margin-bottom: 6px; }
    .price { color: #ff6900; font-size: 18px; font-weight: 700; margin-bottom: 18px; }
    .row {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #eee;
        font-size: 15px;
    }
    .row:last-child { border-bottom: none; }
    .row span:last-child { color: #ff6900; font-weight: 600; }
    .back-home {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 999;
        background: #fff;
        color: #ff6900;
        border: 1px solid #ff6900;
        border-radius: 20px;
        padding: 8px 18px;
        font-size: 14px;
        text-decoration: none;
        transition: .2s;
    }
    .back-home:hover {
    background: #ff6900;
    color: #fff;
    }
</style>
</head>
<body>
    <a href="index.html" class="back-home">← 返回首页</a>
    <div class="box">
    <div class="one">
        <h1>小米汽车</h1>
    </div>
  <div class="tabs">
    <button class="on" onclick="show('su7', this)">SU7</button>
    <button onclick="show('yu7', this)">YU7</button>
  </div>
  <div class="card on" id="su7">
    <img src="小米SU7图片.jpg" alt="小米 SU7">
    <h2>小米 SU7</h2>
    <div class="price">21.99 万起</div>
    <div class="row"><span>车型</span><span>纯电轿车</span></div>
    <div class="row"><span>尺寸</span><span>4997×1963×1455 mm</span></div>
    <div class="row"><span>轴距</span><span>3000 mm</span></div>
    <div class="row"><span>最高续航</span><span>902 km</span></div>
    <div class="row"><span>标准版</span><span>21.99 万</span></div>
    <div class="row"><span>Pro 版</span><span>24.99 万</span></div>
    <div class="row"><span>Max 版</span><span>30.39 万</span></div>
  </div>
  <div class="card" id="yu7">
    <!-- 换成 YU7 图片地址 -->
    <img src="小米YU7图片.jpg" alt="小米 YU7">
    <h2>小米 YU7</h2>
    <div class="price">23.35 万起</div>
    <div class="row"><span>车型</span><span>纯电 SUV</span></div>
    <div class="row"><span>尺寸</span><span>4999×1996×1600 mm</span></div>
    <div class="row"><span>轴距</span><span>3000 mm</span></div>
    <div class="row"><span>最高续航</span><span>835 km</span></div>
    <div class="row"><span>标准版</span><span>23.35 万</span></div>
    <div class="row"><span>Pro 版</span><span>待公布</span></div>
    <div class="row"><span>Max 版</span><span>待公布</span></div>
    <div class="row"><span>GT 版</span><span>38.99 万起</span></div>
  </div>
</div>
<script>
  function show(id, btn) {
    var cards = document.querySelectorAll('.card');
    for (var i = 0; i < cards.length; i++) cards[i].classList.remove('on');
    var btns = document.querySelectorAll('.tabs button');
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove('on');
    document.getElementById(id).classList.add('on');
    btn.classList.add('on');
  }
</script>
</body>
</html>
